services:
  backend:
    build:
      context: .. # Access the parent directory during build to read the parent pom.xml
      dockerfile: commafeed-server/Dockerfile
    container_name: commafeed-backend
    ports:
      - "8082:8082"
    volumes:
      - commafeed-data:/commafeed/data
    restart: unless-stopped

volumes:
  commafeed-data:
